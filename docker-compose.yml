services:
  api:
    build: .
    container_name: omni_insight_api
    command: uvicorn data_intelligence.api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - APP_ENV=development
      - PORT=8000
    restart: unless-stopped

  dashboard:
    build: .
    container_name: omni_insight_dashboard
    command: streamlit run data_intelligence/ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - APP_ENV=development
      - STREAMLIT_PORT=8501
    depends_on:
      - api
    restart: unless-stopped
